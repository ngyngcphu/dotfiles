# tmux config, linked to ~/.config/tmux/tmux.conf by install.sh (repo: ~/dotfiles/tmux/tmux.conf)

set -g default-terminal "screen-256color"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

# Mouse wheel: give it to the app when it asked for the mouse (nvim) or uses the full screen
# (less, htop, nvim at a prompt) as arrow keys; only a plain shell scrolls tmux history (copy-mode).
# If the pane is stuck in copy-mode while nvim wants the mouse, leave copy-mode first.
bind -n WheelUpPane if -F "#{mouse_any_flag}" { if -F "#{pane_in_mode}" { send -X cancel } ; send -M } { if -F "#{pane_in_mode}" { send -M } { if -F "#{alternate_on}" { send -N 3 Up } { copy-mode -e } } }
bind -n WheelDownPane if -F "#{mouse_any_flag}" { if -F "#{pane_in_mode}" { send -X cancel } ; send -M } { if -F "#{pane_in_mode}" { send -M } { if -F "#{alternate_on}" { send -N 3 Down } } }

# Enable kitty keyboard protocol forwarding so apps get modified keys
# (Shift+Enter, Ctrl+Enter, etc.) instead of tmux collapsing them into Enter.
set -g extended-keys on
set -g extended-keys-format csi-u # kitty keyboard protocol (e.g. Shift+Enter in Claude Code)

# Allow kitty graphics protocol passthrough (required for image.nvim inside tmux)
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

set-window-option -g mode-keys vi

# Sync tmux copies with the macOS system clipboard so you can paste
# (Cmd+V) into other apps like Chrome, not just inside tmux.
set -g set-clipboard on # send OSC 52 to terminal (iTerm2 must allow clipboard access)

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy" # copy + push to system clipboard
bind-key -T copy-mode-vi 'Y' send -X copy-pipe-and-cancel "pbcopy" # same for capital Y

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# tpm plugin manager: plugins live in ~/.config/tmux/plugins (outside the repo).
# Set explicitly so a running server that cached the old ~/.tmux/plugins path picks it up on reload.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/cyan' # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
